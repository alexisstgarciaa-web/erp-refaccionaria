{# Alta rápida de cliente: en el ticket del mostrador y en Remisiones › Nueva (para="remision") #}
  <details class="cliente-nuevo" data-servidor{% if cliente_nuevo %} open{% endif %}>
    <summary>+ Cliente nuevo</summary>
    <form method="post" action="{% url 'ticket_cliente_nuevo' %}" class="cliente-nuevo-form" data-recargar
          data-nip="admin" data-nip-cuando="dias" data-nip-para="Dar crédito al cliente nuevo">{% csrf_token %}
      <input type="hidden" name="next" value="{{ aqui }}">
      {% if para %}<input type="hidden" name="para" value="{{ para }}">{% endif %}
      <label class="cn-nombre">Nombre o razón social <input name="nombre" value="{{ cliente_nuevo.nombre }}" maxlength="150" required autocomplete="off"></label>
      <label class="cn-tel">Teléfono <input name="telefono" value="{{ cliente_nuevo.telefono }}" maxlength="20" inputmode="tel" autocomplete="off"></label>
      <label class="cn-rfc"><span>RFC <small>el genérico si no da</small></span> <input name="rfc" value="{{ cliente_nuevo.rfc|default:rfc_generico }}" maxlength="13" autocomplete="off" class="mayusculas" onfocus="this.select()"></label>
      <label class="cn-lista">Lista de precios
        <select name="lista">{% for lp in listas_precio %}<option value="{{ lp.pk }}"{% if cliente_nuevo.lista == lp.pk|stringformat:"d" or not cliente_nuevo and lp.nombre == "Mostrador" %} selected{% endif %}>{{ lp }}</option>{% endfor %}</select>
      </label>
      <details class="cn-direccion"{% if cliente_nuevo.codigo_postal or cliente_nuevo.calle or cliente_nuevo.colonia %} open{% endif %}>
        <summary>Dirección <small>opcional</small></summary>
        <div class="cn-direccion-campos">
          <label>Código postal <input name="codigo_postal" value="{{ cliente_nuevo.codigo_postal }}" maxlength="5" inputmode="numeric" autocomplete="off" data-cp="{% url 'codigo_postal' '00000' %}"></label>
          <label>Colonia <input name="colonia" value="{{ cliente_nuevo.colonia }}" maxlength="120" autocomplete="off"></label>
          <label>Municipio <input name="municipio" value="{{ cliente_nuevo.municipio }}" maxlength="120" autocomplete="off"></label>
          <label>Estado <input name="estado" value="{{ cliente_nuevo.estado }}" maxlength="60" autocomplete="off"></label>
          <label class="cn-calle">Calle <input name="calle" value="{{ cliente_nuevo.calle }}" maxlength="120" autocomplete="off"></label>
          <label>Núm. exterior <input name="numero_exterior" value="{{ cliente_nuevo.numero_exterior }}" maxlength="20" autocomplete="off"></label>
          <label><span>Núm. interior <small>opcional</small></span> <input name="numero_interior" value="{{ cliente_nuevo.numero_interior }}" maxlength="20" autocomplete="off"></label>
        </div>
      </details>
      <label>Días de crédito <input name="dias" value="{{ cliente_nuevo.dias|default:'0' }}" inputmode="numeric" autocomplete="off"></label>
      <label>Límite <span class="con-signo"><input name="limite" value="{{ cliente_nuevo.limite|default:'0' }}" inputmode="decimal" data-cifra="pesos" autocomplete="off"></span></label>
      <p class="cn-nota">Con 0 días queda de contado. Darle crédito pide el NIP de un administrador.</p>
      <button class="btn-sec cn-guardar" type="submit">Dar de alta y elegir</button>
    </form>
  </details>
