{% extends "ventas/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<section class="vehiculo" style="max-width: 440px; margin: 20px auto">
  <h1>Entrar</h1>
  {% if form.errors %}<div class="aviso error" style="margin-top: 14px">Usuario o contraseña incorrectos.</div>{% endif %}
  <form method="post" style="display: flex; flex-direction: column; gap: 16px; margin-top: 18px">{% csrf_token %}
    <label class="campo">Usuario <input name="username" autocomplete="username" autofocus required style="font-family: var(--texto)"></label>
    <label class="campo">Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
