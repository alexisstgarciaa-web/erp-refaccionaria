{% extends "ventas/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<section class="panel" style="max-width: 420px; margin: 40px auto; padding: 24px; display: flex; flex-direction: column; gap: 14px">
  <h1 class="vehiculo" style="font-size: 44px">Entrar</h1>
  {% if form.errors %}<div class="aviso error">Usuario o contraseña incorrectos.</div>{% endif %}
  <form method="post" style="display: flex; flex-direction: column; gap: 14px">{% csrf_token %}
    <label class="campo">Usuario <input name="username" autocomplete="username" autofocus required></label>
    <label class="campo">Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
