# Publicación en Render. En Render: New > Blueprint > este repositorio.
# Sin «plan»: el plan (gratis o de pago) se cambia en el panel de Render y este archivo no lo regresa al publicar.
# En un Blueprint nuevo Render pone su plan de pago más chico.
databases:
  - name: erp-db
    databaseName: erp
    user: erp

services:
  - type: web
    name: erp-refaccionaria
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: NEGOCIO_NOMBRE
        sync: false
